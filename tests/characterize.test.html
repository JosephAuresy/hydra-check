<!doctype html>
<meta charset="utf-8">
<title>characterize tests</title>
<style>body{font:13px/1.4 system-ui,sans-serif;margin:16px}.ok{color:#0a7d2c}.bad{color:#b00020;font-weight:600}pre{background:#f4f4f4;padding:8px;overflow:auto;max-height:260px}h3{margin:18px 0 4px}</style>
<h2>characterize.js tests</h2>
<div id="summary"></div><div id="out"></div>
<script>
/* always load fresh copies: the fixtures and cases change often and the browser caches scripts */
['../src/characterize.js', '../src/char_ui.js', 'fixtures.js', 'synthetic.js', 'cases.js'].forEach(function (s) {
  document.write('<script src="' + s + '?t=' + Date.now() + '"><\/script>');
});
</script>
<script>
(function () {
  var results = [], out = document.getElementById('out');
  function show(title, obj) {
    var h = document.createElement('h3'); h.textContent = title; out.appendChild(h);
    var p = document.createElement('pre'); p.textContent = JSON.stringify(obj, null, 1); out.appendChild(p);
  }
  function compact(r) {
    return r.systems.map(function (s) {
      return {
        coupling: s.coupling, conf: s.couplingConfidence, label: s.label, dir: s.dir,
        surface: s.surface && { family: s.surface.family, rev: s.surface.revision, revConf: s.surface.revisionConfidence,
                                 format: s.surface.format, mixed: s.surface.mixedRevisions, stamps: s.surface.stamps,
                                 gwflow: s.surface.gwflow, lumpedAq: s.surface.hasLumpedAquifer },
        gw: s.groundwater.map(function (g) { return g.family + (g.revision ? ' ' + g.revision : ''); }),
        missing: s.missing, ambiguity: s.ambiguity, notes: s.notes
      };
    });
  }
  window.HDA_RUN = function (mode) {
    var fx = window.HDA_FIXTURES || {}, syn = window.HDA_SYNTHETIC || {};
    var all = {};
    Object.keys(fx).forEach(function (k) { all[k] = { real: true, entries: fx[k].entries }; });
    Object.keys(syn).forEach(function (k) { all[k] = { real: false, entries: syn[k] }; });
    var report = {};
    Object.keys(all).forEach(function (k) { report[k] = compact(HDA.characterize(all[k].entries)); });
    window.__REPORT = report;
    if (mode === 'dump') { Object.keys(report).forEach(function (k) { show(k + (all[k].real ? ' (REAL)' : ' (synthetic)'), report[k]); }); return report; }
    (window.HDA_CASES || []).forEach(function (c) {
      var r = HDA.characterize(c.entries ? c.entries() : all[c.fixture].entries);
      var fails = [];
      try { c.check(r, fails); } catch (e) { fails.push('exception: ' + e.message); }
      results.push({ name: c.name, real: c.real, ok: fails.length === 0, fails: fails });
    });
    var bad = results.filter(function (x) { return !x.ok; });
    document.getElementById('summary').innerHTML = '<b>' + (results.length - bad.length) + '/' + results.length + ' passed</b>' + (bad.length ? ' <span class=bad>(' + bad.length + ' failed)</span>' : '');
    results.forEach(function (x) {
      var d = document.createElement('div'); d.className = x.ok ? 'ok' : 'bad';
      d.textContent = (x.ok ? 'PASS ' : 'FAIL ') + (x.real ? '[real sample] ' : '[spec, synthetic] ') + x.name + (x.ok ? '' : ' :: ' + x.fails.join(' | '));
      out.appendChild(d);
    });
    window.__RESULTS = results;
    return results;
  };
  window.addEventListener('load', function () { var m = location.hash === '#dump' ? 'dump' : 'test'; HDA_RUN(m); });
})();
</script>
