name: Something does not work
description: A button, a page or a file check behaves wrongly, or the page does not load.
labels: ["bug"]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: input
    id: browser
    attributes:
      label: Browser and device
      placeholder: "Chrome 130 on Windows, Safari on iPhone ..."
  - type: textarea
    id: steps
    attributes:
      label: Steps to repeat it
